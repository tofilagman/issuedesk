<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>issuedesk API — Swagger UI</title>
    <link rel="icon" href="/favicon.svg" />
    <!-- Prebuilt, browser-ready Swagger UI bundle served as a static asset.
         Loaded outside the SvelteKit/Vite app on purpose: the swagger-ui source
         package expects Node globals (Buffer/global/process) and breaks in a
         rollup prod build. This dist bundle is self-contained for browsers. -->
    <link rel="stylesheet" href="/vendor/swagger/swagger-ui.css" />
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #fafafa;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1.25rem;
        background: #fff;
        border-bottom: 1px solid #e2e8f0;
      }
      .bar h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: #1e293b;
      }
      .bar a {
        font-size: 0.8rem;
        color: #4f46e5;
        text-decoration: none;
      }
      .bar a:hover {
        text-decoration: underline;
      }
      .bar .spacer {
        margin-left: auto;
      }
      .swagger-ui .topbar {
        display: none;
      }
      #swagger-ui {
        max-width: 1100px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <h1>issuedesk API</h1>
      <a href="/openapi.json" target="_blank" rel="noopener">openapi.json</a>
      <a class="spacer" href="/admin/keys">&larr; API keys</a>
    </div>
    <div id="swagger-ui"></div>
    <script src="/vendor/swagger/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: '/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        docExpansion: 'list',
        defaultModelsExpandDepth: 0,
        persistAuthorization: true,
        tryItOutEnabled: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: 'BaseLayout'
      });
    </script>
  </body>
</html>
